name: Build executables

# Builds the one-file ActionVouch desktop app on each OS and uploads the
# binaries as artifacts. Code signing runs only when the relevant secrets are
# configured (see packaging/README.md); without them the binaries are unsigned.
#
# Every build is gated on the full CI suite first (see gate.yml). Without that,
# a tag push ran this workflow ALONE - ci.yml triggers only on `push: main` and
# `pull_request` - so v0.2.0 and v0.2.1 shipped executables while CI was red.
# The per-binary smoke test below starts the app but runs none of the tests, so
# it cannot catch that on its own.
#
# On a tag push the binaries are also attached to the GitHub Release (see the
# `release` job) rather than being left as login-only, expiring run artifacts,
# and the pure-Python wheel is published to PyPI (see `publish-pypi`).
#
# PyPI is the primary channel, not a nicety. These executables are unsigned, and
# an unsigned binary is actively blocked on a default Windows 11 install (Smart
# App Control) and by macOS Gatekeeper. `pipx install actionvouch` involves no
# code-signing trust decision at all, which is why it leads the README.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Least privilege: the build only reads the repo and uploads artifacts.
permissions:
  contents: read

jobs:
  # Run the identical gate CI runs. A tag push must not produce a release
  # artifact from a tree that fails lint, types, tests, or the verifier.
  gate:
    uses: ./.github/workflows/gate.yml

  # Publish the wheel + sdist to PyPI. ActionVouch is pure Python with no runtime
  # dependencies, so one py3-none-any wheel serves every OS and architecture -
  # including the Intel Macs the arm64 executable cannot run on at all.
  #
  # Uses PyPI Trusted Publishing (OIDC): no API token is stored in this repo.
  # One-time setup on PyPI: Project -> Publishing -> add a GitHub publisher for
  # tygartnexus/ActionVouch, workflow `build.yml`. Optionally scope it to an
  # environment and add `environment:` here to require a reviewer per release.
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # OIDC identity for Trusted Publishing. Deliberately the ONLY permission:
      # this job never needs to read or write repository contents.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (package extra)
        run: python -m pip install -e ".[package]"

      - name: Build one-file executable
        run: pyinstaller packaging/actionvouch.spec --noconfirm

      # Signing secrets are scoped to these steps only (not job-wide), so the
      # build/test steps above never see them. Each step self-skips when its
      # cert is not configured, keeping the secret out of the `if:` context.
      - name: Sign (Windows / Authenticode)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No Windows signing cert configured; shipping the build unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          & signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 dist/ActionVouch.exe

      - name: Sign + notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "No Apple signing cert configured; shipping the build unsigned."
            exit 0
          fi
          # Honest placeholder: the codesign + notarytool flow is NOT yet wired
          # up in CI, so this binary is still unsigned even when secrets are set.
          echo "::warning::Apple signing secrets are set, but CI signing is not"
          echo "::warning::implemented yet — this macOS binary is NOT signed."
          # Documented release flow to implement here (see packaging/README.md):
          #   1. import the Developer ID cert into a temporary keychain;
          #   2. codesign --deep --options runtime --sign "Developer ID Application: ..." dist/ActionVouch
          #   3. xcrun notarytool submit dist/ActionVouch --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          #   4. xcrun stapler staple dist/ActionVouch

      - name: Smoke-test the built binary (headless)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/ActionVouch.exe"; else BIN="dist/ActionVouch"; chmod +x "$BIN"; fi
          "$BIN" app --no-browser --port 8799 &
          PID=$!
          for i in $(seq 1 15); do curl -fsS "http://127.0.0.1:8799/" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "http://127.0.0.1:8799/" | grep -q "ActionVouch"
          curl -fsS -X POST "http://127.0.0.1:8799/api/schema" -H "Content-Type: application/json" -d '{}' | grep -q app_version
          echo "binary serves the app and schema OK"
          kill "$PID" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ActionVouch-${{ matrix.os }}
          path: |
            dist/ActionVouch
            dist/ActionVouch.exe
          if-no-files-found: error

  # Attach the built binaries to the GitHub Release on a tag push.
  #
  # Without this the binaries existed ONLY as workflow run artifacts, which are
  # invisible to anonymous visitors (downloading one requires a GitHub login)
  # and are deleted on the retention clock. That is why v0.1.0, v0.2.0 and
  # v0.2.1 all published with zero downloadable assets - the Releases page
  # offered a local-first tool with nothing to run.
  release:
    # Tag pushes only; a manual workflow_dispatch build publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # The only job granted write access. gate and build stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the binaries per platform and checksum them
        run: |
          set -euo pipefail
          mkdir -p upload
          cp artifacts/ActionVouch-windows-latest/ActionVouch.exe upload/ActionVouch-windows.exe
          cp artifacts/ActionVouch-macos-latest/ActionVouch       upload/ActionVouch-macos
          cp artifacts/ActionVouch-ubuntu-latest/ActionVouch      upload/ActionVouch-linux
          # upload-artifact does not preserve the executable bit, and a release
          # asset download would not carry it anyway - macOS/Linux users chmod +x.
          chmod +x upload/ActionVouch-macos upload/ActionVouch-linux
          cd upload && sha256sum ./* | tee SHA256SUMS.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # A tag push does not create a Release on its own, so make one if the
          # tag has no Release yet; --clobber keeps a re-run idempotent.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" upload/ActionVouch-windows.exe upload/ActionVouch-macos upload/ActionVouch-linux upload/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached 3 binaries + SHA256SUMS.txt to $TAG"
